services:
  - type: web
    name: quizarena-api
    runtime: node
    buildCommand: npm ci && npm run db:generate && npm run build:server
    preDeployCommand: npm run db:migrate:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WEB_APP_URL
        sync: false
